name: Java CI

on:
  push:
    branches: [ master, phase-1, phase-2, phase-3 ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Compile
      run: javac bildirim_sistemi/src/bildirim_sistemi/*.java -d bin
